[project]
name = "kerbalforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Accoustium", email = "t.pogue.python@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
kerbalforge = "kerbalforge:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.164.0",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.mypy]
python_version = "3.13"
warn_unused_configs = true
strict = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false

[tool.coverage.report]
fail_under = 95
show_missing = true
